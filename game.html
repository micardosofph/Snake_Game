<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8"> 
    <link rel="stylesheet" href="snake.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
</head>

<body class="body">

    <h1 style="color: white;  font-size: 64px; margin: 0 0 0 0;">snake</h1>

    <div class="score">
        <h1 class="scoreText">pontuacao: </h1>
        <h1 class="scoreText" id="pontuacao">0</h1>
    </div>

    <canvas id="board" class="quadro"></canvas>

    <div class="gameOverScreen" id="gameOverScreen">
        <h1>GAME OVER!</h1>
        <p id="finalScore"></p>

        <button onclick="restartGame()" class="body">reiniciar</button>
    </div>

    <h1  style=" color: white; margin: 20 0 20 0;">R para reiniciar <br>setas/WASD para se movimentar</h1>


    <script src="snake.js"></script>
</body>


</html>
